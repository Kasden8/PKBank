name: Build

on:
  push:
    branches: [master, pc-port]
  pull_request:
    branches: [master, pc-port]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PKBank.slnx

      - name: Build
        run: dotnet build PKBank.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PKBank.slnx --configuration Release --no-build --verbosity normal
